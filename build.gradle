tasks.register('screeningRun', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs one screening for explicitly specified stocks without Spring Boot DevTools.'
	mainClass = 'com.stockapp.StockSignalBackendApplication'
	def devToolsJar = configurations.developmentOnly.incoming.artifactView {
		componentFilter { componentId ->
			componentId instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
					componentId.group == 'org.springframework.boot' &&
					componentId.module == 'spring-boot-devtools'
		}
	}.files
	classpath = sourceSets.main.runtimeClasspath - devToolsJar
	systemProperty 'file.encoding', 'UTF-8'
	jvmArgs = [
			'-Dfile.encoding=UTF-8',
			'-Dconsole.encoding=UTF-8',
			'-Dsun.stdout.encoding=UTF-8',
			'-Dsun.stderr.encoding=UTF-8'
	]
}

tasks.register('kisWebSocketProbe', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs the isolated KIS WebSocket subscription probe.'
	mainClass = 'com.stockapp.external.kis.probe.KisWebSocketProbeApplication'
	def devToolsJar = configurations.developmentOnly.incoming.artifactView {
		componentFilter { componentId ->
			componentId instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
					componentId.group == 'org.springframework.boot' &&
					componentId.module == 'spring-boot-devtools'
		}
	}.files
	classpath = sourceSets.main.runtimeClasspath - devToolsJar
	args '--spring.profiles.active=local,kis-websocket-probe'
	if (project.hasProperty('kisWebSocketProbeStockCodes')) {
		args "--kis-websocket-probe.stock-codes=${project.property('kisWebSocketProbeStockCodes')}"
	}
	if (project.hasProperty('kisWebSocketProbeMode')) {
		args "--kis-websocket-probe.mode=${project.property('kisWebSocketProbeMode')}"
	}
	if (project.hasProperty('kisWebSocketProbeUnsubscribeStockCode')) {
		args "--kis-websocket-probe.unsubscribe-stock-code=${project.property('kisWebSocketProbeUnsubscribeStockCode')}"
	}
	if (project.hasProperty('kisWebSocketProbeReplacementStockCode')) {
		args "--kis-websocket-probe.replacement-stock-code=${project.property('kisWebSocketProbeReplacementStockCode')}"
	}
	if (project.hasProperty('kisWebSocketProbeSessionAStockCodes')) {
		args "--kis-websocket-probe.session-a-stock-codes=${project.property('kisWebSocketProbeSessionAStockCodes')}"
	}
	if (project.hasProperty('kisWebSocketProbeSessionBStockCodes')) {
		args "--kis-websocket-probe.session-b-stock-codes=${project.property('kisWebSocketProbeSessionBStockCodes')}"
	}
	if (project.hasProperty('kisWebSocketProbeLogControlPayload')) {
		args "--kis-websocket-probe.log-control-payload=${project.property('kisWebSocketProbeLogControlPayload')}"
	}
	systemProperty 'file.encoding', 'UTF-8'
	jvmArgs = [
			'-Dfile.encoding=UTF-8',
			'-Dconsole.encoding=UTF-8',
			'-Dsun.stdout.encoding=UTF-8',
			'-Dsun.stderr.encoding=UTF-8'
	]
}

tasks.register('kisDailyPriceProbe', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs the isolated one-shot KIS daily price probe.'
	mainClass = 'com.stockprobe.kisdailyprice.KisDailyPriceProbeApplication'
