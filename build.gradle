plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stockapp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
	systemProperty 'file.encoding', 'UTF-8'
	jvmArgs = [
			'-Dfile.encoding=UTF-8',
			'-Dconsole.encoding=UTF-8',
			'-Dsun.stdout.encoding=UTF-8',
			'-Dsun.stderr.encoding=UTF-8'
	]
}

tasks.register('dailyPriceLoad', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Runs the one-time daily price load without Spring Boot DevTools.'
	mainClass = 'com.stockapp.StockSignalBackendApplication'
	def devToolsJar = configurations.developmentOnly.incoming.artifactView {
		componentFilter { componentId ->
			componentId instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
					componentId.group == 'org.springframework.boot' &&
					componentId.module == 'spring-boot-devtools'
		}
	}.files
	classpath = sourceSets.main.runtimeClasspath - devToolsJar
	systemProperty 'file.encoding', 'UTF-8'
	jvmArgs = [
		'-Dfile.encoding=UTF-8',
		'-Dconsole.encoding=UTF-8',
		'-Dsun.stdout.encoding=UTF-8',
		'-Dsun.stderr.encoding=UTF-8'
	]
}

