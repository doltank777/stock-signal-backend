		args "--kis-daily-price-probe.stock-code=${project.property('kisDailyPriceProbeStockCode')}"
	}
	if (project.hasProperty('kisDailyPriceProbeTargetDate')) {
		args "--kis-daily-price-probe.target-date=${project.property('kisDailyPriceProbeTargetDate')}"
	}
	systemProperty 'file.encoding', 'UTF-8'
