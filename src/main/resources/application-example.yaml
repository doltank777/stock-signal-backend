server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/stock_signal_db
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD

jwt:
  secret: YOUR_JWT_SECRET

app:
  crypto:
    secret-key: YOUR_AES_SECRET_KEY

kis:
  environment: virtual
  app-key: YOUR_APP_KEY
  app-secret: YOUR_APP_SECRET
  base-url: https://openapivts.koreainvestment.com:29443
  web-socket-url: ws://ops.koreainvestment.com:31000
  # CTCA0903R is not supported by the paper REST environment (EGW02006).
  # Use a separately issued real-trading App Key and App Secret.
  trading-calendar:
    base-url: ${KIS_TRADING_CALENDAR_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_TRADING_CALENDAR_APP_KEY:}
    app-secret: ${KIS_TRADING_CALENDAR_APP_SECRET:}
    # CTCA0903R showed rate limiting at the generic 50 ms smart_sleep;
    # use a conservative one-request-per-second page interval.
    request-interval-ms: 1000
    # Safety guard only; normal completion follows the KIS continuation header.
    max-pages: 50
    # Official KIS rate-limit handling waits 61 seconds; retry only once.
    rate-limit-retry-max-attempts: 2
    rate-limit-retry-delay-ms: 61000
  daily-price:
    target-trading-days: 250
    request-window-months: 6
    request-delay-ms: 1200
    retry-max-attempts: 3
    retry-initial-delay-ms: 2000
    max-api-calls-per-stock: 10
    max-lookback-years: 3
    progress-log-interval: 25
    update:
      request-delay-ms: 1200
      max-catch-up-days: 30
      retry:
        # 최초 요청을 포함한 최대 시도 횟수입니다.
        max-attempts: 3
        initial-backoff-ms: 2000
        multiplier: 2
      scheduler:
        # KIS 당일 일봉 확정 시각 실검증 전까지 기본 비활성입니다.
        enabled: false
        cron: "0 20 16 * * MON-FRI"
    finalization:
      scheduler:
        # Keep disabled until the KIS final OHLCV probe and production DB
        # validation are complete. Set an explicit cron before enabling.
        enabled: false
        cron: "-"
        zone: "Asia/Seoul"
      startup-recovery:
        # Recovers only the latest execution row when it is not ready.
        enabled: false

daily-price-load:
  # 비워 두면 Asia/Seoul 기준 어제를 사용합니다.
  base-date:
  # 비워 두면 KOSPI/KOSDAQ 전체 종목을 대상으로 합니다.
  stock-code:

daily-price-update:
  # 비워 두면 Asia/Seoul 기준 오늘을 사용합니다.
  base-date:
  # 비워 두면 KOSPI/KOSDAQ 전체 종목을 대상으로 합니다.
  stock-code:

screening-run:
  # 쉼표로 구분한 1~50개의 KOSPI/KOSDAQ 종목 코드를 반드시 지정합니다.
  stock-codes:
  # 전체시장 실행 시 stock-codes는 비우고 true로 명시합니다.
  all-stocks: false
  # ISO 형식(YYYY-MM-DD)의 기준일을 반드시 지정합니다.
  base-date:

stock:
  import-key: "your-import-key"
