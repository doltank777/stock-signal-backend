spring:
  profiles:
    active: local

kis:
  trading-calendar:
    base-url: ${KIS_TRADING_CALENDAR_BASE_URL:https://openapi.koreainvestment.com:9443}
    app-key: ${KIS_TRADING_CALENDAR_APP_KEY:}
    app-secret: ${KIS_TRADING_CALENDAR_APP_SECRET:}
    request-interval-ms: 1000
    max-pages: 50
    rate-limit-retry-max-attempts: 2
    rate-limit-retry-delay-ms: 61000
  daily-price:
    finalization:
      scheduler:
        enabled: false
        cron: "-"
        zone: "Asia/Seoul"
      startup-recovery:
        enabled: false

operational-screening:
  realtime:
    morning-start: "08:30"
    morning-deadline: "08:55"
    retry-interval: "5m"
    market-open: "09:00"
    market-close: "15:30"
    morning:
      enabled: false
      cron: "0 30,35,40,45,50,55 8 * * MON-FRI"
